<div class="container-fluid px-0">

    <nav class="navbar navbar-expand-lg bg-body border-bottom">
        <div class="container">
            <a class="navbar-brand" href="/">My shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Переключатель навигации">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <a class="navbar-brand ms-auto me-0" href="#">Каталог</a>

                <form class="d-flex me-0 ms-auto w-50" role="search">
                    <input class="form-control me-2" type="search" placeholder="Поиск" aria-label="Поиск">
                    <button class="btn btn-outline-primary" type="submit">Поиск</button>
                </form>

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Избранное</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Заказы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Корзина</a>
                    </li>
                    <li class="nav-item dropdown">
                        {% if request.user.is_authenticated %}
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            {{ request.user.username }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="{% url 'users:profile' %}">Личный кабинет</a></li>
                            <li>
                                <form action="{% url 'users:logout' %}" method="post">
                                    {% csrf_token %}
                                    <button style="color: #5993bb" class="dropdown-item" type="submit">Выйти</button>
                                </form>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Что-то еще здесь</a></li>
                            <li><a class="dropdown-item" href="{% url 'users:registration' %}">Регистрация</a></li>
                        </ul>
                        {% else %}
                        <a class="nav-link" href="{% url 'users:login' %}">Вход</a>
                        {% endif %}
                    </li>
                </ul>

            </div>
        </div>
    </nav>

</div>
