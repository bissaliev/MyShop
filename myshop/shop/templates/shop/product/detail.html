<!-- Детальная информация о товаре-->
{% extends "shop/base.html" %}
{% load static %}
{% block title %}
{{ product.name }}
{% endblock %}
{% block content %}

<div class="product-detail">
    <img src="{% if product.image %}{{ product.image.url }}{% else %}{% static 'img/no_image.png' %}{% endif %}">
    <h1>{{ product.name }}</h1>
    <h2>
        <a href="{{ product.category.get_absolute_url }}">
            {{ product.category }}
        </a>
    </h2>
    <p class="price">${{ product.price }}</p>

    <!--Форма добавления товара в корзину-->
    <form class="add-to-cart-form" action="{% url 'cart:cart_add' product.id %}" method="post">
        {% csrf_token %}
        <div class="input-group w-25">
            <select class="form-select" name="quantity" id="id_quantity">
                {% for item in cart_product_form.quantity %}
                {{ item }}
                {% endfor %}
            </select>
            <button class="btn btn-primary" type="submit">Добавить в корзину</button>
        </div>
    </form>
    <!--Форма добавления товара в корзину-->
    <div class="mt-3">
        {{ product.description|linebreaks }}
    </div>
</div>

<script src="{% static 'js/scripts.js' %}"></script>
{% endblock %}
