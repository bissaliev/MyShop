{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>{% block title %}My shop{% endblock %}</title>
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
</head>

<body>
    <div id="header">
        <a href="/" class="logo">My shop</a>
    </div>
    <div id="subheader">
        <!--Корзина-->
        <div class="cart">
            <a href="{% url 'cart:cart_detail' %}">Корзина: {{ cart|length }}</a>
        </div>
        <!--Корзина-->
    </div>
    <div id="content">
        {% block content %}
        {% endblock %}
    </div>
</body>

</html>
