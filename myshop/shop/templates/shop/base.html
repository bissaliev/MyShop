{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>{% block title %}My shop{% endblock %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">
    <header class="header">{% include 'includes/header.html' %}</header>

    {% include 'includes/model_window.html' %}

    <main class="container-fluid justify-content-center" style="flex: 1;">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="pt-3 mt-4 bg-primary">{% include 'includes/footer.html' %}</footer>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    {% if messages %}
    <script>
        $(document).ready(function () {
            $('#messageModal').modal('show');
        });
    </script>
    {% endif %}
</body>

</html>
